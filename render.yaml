# Local deployment contract for the full-stack demo.
# Review this file, connect the repository in Render, and create the Blueprint
# from your Render workspace when you are ready. This project does not deploy itself.
services:
  - type: web
    name: tanstack-render-atlas
    runtime: node
    plan: 1c-2g
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tanstack-render-atlas-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: tanstack-render-atlas-db
    plan: basic-256mb
    region: oregon
    databaseName: render_atlas
    user: render_atlas
