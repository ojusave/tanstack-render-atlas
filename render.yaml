services:
  - type: web
    name: focus-board
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: focus-board-db
          property: connectionString

databases:
  - name: focus-board-db
    region: oregon
    plan: basic-256mb
    databaseName: focus_board
    user: focus_board
